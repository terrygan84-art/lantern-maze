<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lantern Maze — 10 Level Test</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#050609;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #app{position:relative;width:min(96vw,720px);height:min(96vh,900px);display:flex;flex-direction:column;gap:8px}
  #hud{height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid #292b31;border-radius:12px;background:#0b0c10}
  .stat{font-size:12px;color:#aaa;letter-spacing:.08em;text-transform:uppercase}
  .value{font-size:17px;color:#fff;font-weight:700;margin-top:2px}
  #mazeWrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid #25272d;background:#000}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  #controls{height:170px;display:flex;align-items:center;justify-content:center}
  .pad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:54px 54px;gap:7px}
  button{border:1px solid #383a42;background:#15171d;color:#eee;border-radius:12px;font-size:24px;touch-action:manipulation}
  button:active{background:#242731}
  #up{grid-column:2}
  #left{grid-column:1;grid-row:2}
  #down{grid-column:2;grid-row:2}
  #right{grid-column:3;grid-row:2}
  #restart{font-size:12px;padding:8px 11px}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,3,6,.82);backdrop-filter:blur(3px);z-index:5}
  .card{width:min(88%,420px);padding:28px;border:1px solid #343740;border-radius:18px;background:#0b0d12;text-align:center;box-shadow:0 20px 70px #000}
  .title{font-size:28px;font-weight:800;letter-spacing:.08em}
  .sub{color:#aaa;margin:7px 0 18px}
  .stars{font-size:42px;letter-spacing:7px;margin:8px 0 18px}
  .gold{color:#f3cf65}.dim{color:#34363d}
  .mainBtn{padding:12px 22px;font-size:15px;font-weight:700}
  #hint{font-size:11px;color:#666;text-align:center;height:14px}
  @media(max-height:650px){#controls{height:120px}.pad{transform:scale(.82)}#hud{height:46px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><div class="stat">Level</div><div class="value" id="level">1 / 10</div></div>
    <div><div class="stat">Moves</div><div class="value" id="moves">0</div></div>
    <div><div class="stat">Stars</div><div class="value" id="totalStars">0 / 30</div></div>
    <button id="restart">RESTART</button>
  </div>
  <div id="mazeWrap"><canvas id="game"></canvas><div id="overlay"><div class="card">
    <div class="title" id="ovTitle">ESCAPED</div>
    <div class="sub" id="ovSub"></div>
    <div class="stars" id="ovStars"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="mainBtn" id="retryBtn">RETRY FOR STARS</button>
      <button class="mainBtn" id="nextBtn">NEXT LEVEL</button>
    </div>
  </div></div></div>
  <div id="controls">
    <div class="pad">
      <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
    </div>
  </div>
  <div id="hint">Build the map in your head. The path behind you disappears.</div>
  <div id="levels" style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:2px 0 4px"></div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const levelEl=document.getElementById('level'),movesEl=document.getElementById('moves'),starsEl=document.getElementById('totalStars');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovSub=document.getElementById('ovSub'),ovStars=document.getElementById('ovStars');
const retryBtn=document.getElementById('retryBtn'),nextBtn=document.getElementById('nextBtn'),levelsEl=document.getElementById('levels');

const SIZE=21;
let level=1,moves=0,player={x:1,y:1},exit={x:19,y:19},grid=[],path=[],routeLength=0,won=false;
let bestStars=JSON.parse(localStorage.getItem('lanternMazeStars')||'[]');
const configs=[
  {mem:12,vision:4.5},{mem:11,vision:4.35},{mem:10,vision:4.2},{mem:9,vision:4.05},{mem:8,vision:3.9},
  {mem:8,vision:3.75},{mem:7,vision:3.6},{mem:6,vision:3.45},{mem:5,vision:3.3},{mem:5,vision:3.15}
];

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function makeMaze(seed){
  const r=mulberry32(seed);
  grid=Array.from({length:SIZE},()=>Array(SIZE).fill(1));
  const stack=[[1,1]]; grid[1][1]=0;
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const dirs=[[2,0],[-2,0],[0,2],[0,-2]];
    for(let i=dirs.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[dirs[i],dirs[j]]=[dirs[j],dirs[i]]}
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<SIZE-1&&ny>0&&ny<SIZE-1&&grid[ny][nx]===1){
        grid[y+dy/2][x+dx/2]=0;grid[ny][nx]=0;stack.push([nx,ny]);moved=true;break;
      }
    }
    if(!moved)stack.pop();
  }
  // choose farthest reachable tile from start
  const q=[[1,1]],dist=Array.from({length:SIZE},()=>Array(SIZE).fill(-1));dist[1][1]=0;
  let far=[1,1];
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];
    if(dist[y][x]>dist[far[1]][far[0]])far=[x,y];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&grid[ny][nx]===0&&dist[ny][nx]<0){dist[ny][nx]=dist[y][x]+1;q.push([nx,ny])}
    }
  }
  exit={x:far[0],y:far[1]};
  player={x:1,y:1}; moves=0; path=[[1,1]]; won=false;
  routeLength=dist[exit.y][exit.x];
  updateHUD();draw();
}
function levelSeed(n){return 918273+n*7919}
function updateHUD(){
  levelEl.textContent=`${level} / 10`;
  movesEl.textContent=moves;
  starsEl.textContent=`${bestStars.reduce((a,b)=>a+(b||0),0)} / 30`;
  levelsEl.innerHTML='';
  for(let i=1;i<=10;i++){
    const b=document.createElement('button');
    b.style.cssText='font-size:11px;padding:5px 7px;border-radius:8px;min-width:38px';
    const s=bestStars[i-1]||0;
    b.textContent=`${i} ${s?'★'.repeat(s)+'☆'.repeat(3-s):'—'}`;
    b.title=s?`Level ${i}: ${s} star${s>1?'s':''}`:`Level ${i}: not completed`;
    if(i>level && !bestStars[i-2]){ b.disabled=true; b.style.opacity='.35'; }
    b.onclick=()=>{ if(i<=level || bestStars[i-1]) { level=i; makeMaze(levelSeed(level)); overlay.style.display='none'; } };
    levelsEl.appendChild(b);
  }
}
function visible(x,y,px,py,rad){
  const d=Math.hypot(x-px,y-py); if(d>rad)return false;
  // simple line of sight through maze cells
  const steps=Math.ceil(d*4);
  for(let i=1;i<steps;i++){
    const t=i/steps,xx=Math.round(px+(x-px)*t),yy=Math.round(py+(y-py)*t);
    if(grid[yy]?.[xx]===1)return false;
  }
  return true;
}
function starCount(){
  // Stars are mastery over the level's shortest route. 1=escape, 2=within 25%, 3=within 10%.
  if(moves<=Math.ceil(routeLength*1.10))return 3;
  if(moves<=Math.ceil(routeLength*1.25))return 2;
  return 1;
}
function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.floor(w*dpr)||canvas.height!==Math.floor(h*dpr)){canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#010204';ctx.fillRect(0,0,w,h);
  const cell=Math.min(w/SIZE,h/SIZE),ox=(w-cell*SIZE)/2,oy=(h-cell*SIZE)/2;
  // base maze is faintly visible only near the player
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
    if(!visible(x,y,player.x,player.y,configs[level-1].vision+1.2))continue;
    const px=ox+x*cell,py=oy+y*cell;
    ctx.fillStyle=grid[y][x]===1?'#20232a':'#0b0d12';
    ctx.fillRect(px,py,cell+.5,cell+.5);
  }
  // disappearing trail: only the latest N visited floor cells remain.
  const keep=configs[level-1].mem;
  const start=Math.max(0,path.length-keep);
  for(let i=start;i<path.length;i++){
    const [x,y]=path[i];
    if(!visible(x,y,player.x,player.y,configs[level-1].vision+0.7))continue;
    const a=.15+.35*((i-start+1)/(path.length-start));
    ctx.fillStyle=`rgba(180,188,205,${a})`;
    ctx.fillRect(ox+x*cell+cell*.22,oy+y*cell+cell*.22,cell*.56,cell*.56);
  }
  // exit only if illuminated
  if(visible(exit.x,exit.y,player.x,player.y,configs[level-1].vision)){
    ctx.fillStyle='#66e59b';ctx.beginPath();ctx.arc(ox+(exit.x+.5)*cell,oy+(exit.y+.5)*cell,cell*.25,0,Math.PI*2);ctx.fill();
  }
  // player
  ctx.fillStyle='#f4d27a';ctx.beginPath();ctx.arc(ox+(player.x+.5)*cell,oy+(player.y+.5)*cell,cell*.27,0,Math.PI*2);ctx.fill();
  // lantern glow
  const gx=ox+(player.x+.5)*cell,gy=oy+(player.y+.5)*cell;
  const g=ctx.createRadialGradient(gx,gy,cell*.3,gx,gy,cell*configs[level-1].vision);
  g.addColorStop(0,'rgba(255,214,125,.12)');g.addColorStop(1,'rgba(255,214,125,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx,gy,cell*configs[level-1].vision,0,Math.PI*2);ctx.fill();
}
function move(dx,dy){
  if(won)return;
  const nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=SIZE||ny>=SIZE||grid[ny][nx]!==0)return;
  player={x:nx,y:ny};moves++;path.push([nx,ny]);draw();updateHUD();
  if(nx===exit.x&&ny===exit.y)finish();
}
function finish(){
  won=true;
  const s=starCount();
  bestStars[level-1]=Math.max(bestStars[level-1]||0,s);
  localStorage.setItem('lanternMazeStars',JSON.stringify(bestStars));
  updateHUD();

  ovTitle.textContent=level===10?'MAZE COMPLETE':'ESCAPED';
  ovSub.textContent=`${moves} moves · route ${routeLength} · best ${bestStars[level-1]}★`;
  ovStars.innerHTML='<span class="gold">★</span>'.repeat(s)+'<span class="dim">★</span>'.repeat(3-s);

  retryBtn.textContent=s<3?'RETRY FOR STARS':'REPLAY LEVEL';
  nextBtn.textContent=level===10?'BACK TO LEVELS':'NEXT LEVEL';
  nextBtn.style.display='inline-block';
  overlay.style.display='flex';
}
function restart(){makeMaze(levelSeed(level));overlay.style.display='none'}
document.getElementById('restart').onclick=restart;

retryBtn.onclick=()=>{
  makeMaze(levelSeed(level));
  overlay.style.display='none';
};

nextBtn.onclick=()=>{
  if(level<10){
    level++;
    makeMaze(levelSeed(level));
    overlay.style.display='none';
  }else{
    overlay.style.display='none';
    updateHUD();
  }
};
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(map[k]){e.preventDefault();move(...map[k])}
});
[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(([id,dx,dy])=>document.getElementById(id).addEventListener('click',()=>move(dx,dy)));
let sx=0,sy=0;
canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy>0?1:-1)},{passive:true});

makeMaze(levelSeed(level));
</script>
</body>
</html>
